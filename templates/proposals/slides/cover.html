{{!-- Cover Slide --}}
<div style="position:absolute;right:-80px;top:-80px;width:480px;height:480px;background:radial-gradient(circle,rgba(158,124,46,.07) 0%,transparent 65%);pointer-events:none;z-index:1;"></div>
<div style="position:absolute;left:-100px;bottom:-100px;width:360px;height:360px;background:radial-gradient(circle,rgba(158,124,46,.04) 0%,transparent 65%);pointer-events:none;z-index:1;"></div>
<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:60px 80px;">
  <div style="font-family:'Figtree',sans-serif;font-size:17px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#1a1a1f;margin-bottom:44px;">{{agency_name}}</div>
  <div style="width:72px;height:3px;background:linear-gradient(90deg,var(--brand-primary, #9e7c2e),var(--brand-primary-light, #c8a44e));border-radius:2px;margin-bottom:44px;"></div>
  <div style="font-family:'Figtree',sans-serif;font-size:52px;font-weight:700;color:#1a1a1f;line-height:1.05;margin-bottom:10px;">SEO & GEO Proposal</div>
  <div style="font-size:26px;font-weight:600;color:var(--brand-primary, #9e7c2e);letter-spacing:.04em;margin-bottom:50px;">{{client_name}}</div>
  <div style="font-size:15px;color:#8a8892;">{{date}}</div>
</div>
