{{!-- Action Plan Slide --}}
<div class="ey">Strategy</div>
<div class="slide-title">Action Plan</div>
<div class="slide-src">{{client_name}} — Implementation Timeline</div>

<div class="action-timeline">
  {{#each phases}}
  <div class="action-phase">
    <div class="action-phase-h" style="background:{{color}};">{{title}}</div>
    <div class="action-phase-period">{{period}}</div>
    <ul class="action-phase-items" style="color:{{color}};">
      {{#each items}}
      <li>{{this}}</li>
      {{/each}}
    </ul>
  </div>
  {{/each}}
</div>

{{#if notes}}
<div style="margin-top:12px;padding:12px 16px;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.08);border-radius:8px;font-size:13px;color:#5a5862;">
  {{notes}}
</div>
{{/if}}
